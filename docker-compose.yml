version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - burraco

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - burraco

  composer:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    networks:
      - burraco

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - burraco

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: burracoup_live
      POSTGRES_USER: burraco
      POSTGRES_PASSWORD: burraco_pw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - burraco

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - burraco

networks:
  burraco:

volumes:
  pgdata:
